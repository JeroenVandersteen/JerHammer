
<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>JerHammer Dice Roller</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <?xml version="1.0" encoding="UTF-8" standalone="no"?>
        
        <style>

            body {
                font-family: "Poppins";
            }

            .stepper-box {
                display: flex;
                align-items: center;
            }

            .custom-num {
                margin: 0.2em;
                margin-right: 1em;
                margin-left: 1em;
                /* color: #fff; */
                display: flex;
                width: 3em;
                height: 7em;
                border: 1px #363636 solid;
                border-radius: 3em;
                justify-content: space-between;
                align-items: center;
                flex-direction: column;
                transition: 0.3s;
            }

            /* remove default arrows from the input field */
            .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            .num-input {
                font-size: 1.5em;
                text-align: center;
                background: none;
                border: none;
                color: #21d99b;
                font-weight: bold;
                width: 100%;
            }

            .num-input:focus {
                outline: none;
            }

            .custom-num i {
                font-size: 2em;
                cursor: pointer;
            }

            .input-with-label {
                display: block;
            }

            .input-label {
                text-align: center;
                color: #4f4f4f;
                font-size: .8em;
            }

            .roll-dice {
                height: 30px;
                border-radius: 15px;
                width: 300px;
                background-color: #000000;
                border: none;
                color: white;
                margin-top: 10px;
                font-family: "Poppins";
            }

            .history {
                max-height: 300px;
                overflow-y: auto;
            }

            .clear-history {
                height: 30px;
                border-radius: 15px;
                width: 100px;
                background-color: #6f0101;
                border: none;
                color: white;
                margin-top: 10px;
                margin-left: 200px;
            }

            .disp-result {
                margin-left: 140px;
                margin-top: 10px;
                font-size: 3em;
                color: rgb(0, 0, 0);
            }
        </style>
       

    </head>


    <body>

        <div class="stepper-box">
            <div class="input-with-label">
                <div class="custom-num">
                    <i class="fas fa-angle-up arr-up"></i>
                    <input
                        type="number"
                        class="num-input"
                        min="0"
                        max="10"
                        value="3"
                        data-color="#21d99b"
                        id="num-dice-input"
                    />
                    <i class="fas fa-angle-down arr-down"></i>
                </div>
                <div class="input-label">dice</div>
            </div>

            <svg width="20" height="20" viewBox="0 0 480 480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
                <g transform="matrix(1.49389,0,0,1.49389,-148.584,-142.413)">

                </g>
            </svg>
            +

            <div class="input-with-label">
                <div class="custom-num">
                    <i class="fas fa-angle-up arr-up"></i>
                    <input
                        type="number"
                        class="num-input"
                        min="-10"
                        max="10"
                        value="0"
                        data-color="#21d99b"
                        id="modifier-input"
                    />
                    <i class="fas fa-angle-down arr-down"></i>
                </div>
                <div class="input-label">modifier</div>
            </div>
            with 

            <div class="input-with-label">
                <div class="custom-num">
                    <i class="fas fa-angle-up arr-up"></i>
                    <input
                        type="number"
                        class="num-input"
                        min="-10"
                        max="10"
                        value="0"
                        data-color="#21d99b"
                        id="adv-input"
                    />
                    <i class="fas fa-angle-down arr-down"></i>
                </div>
                <div class="input-label">advantage</div>
            </div>

        </div>


        <form class="input-form">
            <button type="button" class="roll-dice">ROLL</button>
        </form>

        <div class="disp-result">
            0
        </div>

        <form class="input-form">
            <button type="button" class="clear-history">clear history</button>
        </form>

        <div class="history" id="history"></div>
        
    <script>

        // to make the stepper inputs functionality
        const customNum = document.querySelectorAll('.custom-num');
        customNum.forEach(num => {
            const numInput = num.querySelector('.num-input');
            const arrUp = num.querySelector('.arr-up');
            const arrDown = num.querySelector('.arr-down');

            numInput.style.color = numInput.dataset.color;

            arrUp.addEventListener('click', () => {
                numInput.stepUp();
                checkMaxMin();
            });

            arrDown.addEventListener('click', () => {
                numInput.stepDown();
                checkMaxMin();
            });

            numInput.addEventListener('input', checkMaxMin);

            function checkMaxMin() {
                const numInputValue = parseInt(numInput.value);
                const numInputMax = parseInt(numInput.max);
                const numInputMin = parseInt(numInput.min);

                if (numInputValue === numInputMax) {
                    num.style.paddingTop = "0.8em";
                    num.style.height = "5em";
                    arrUp.style.display = "none";
                    num.style.paddingBottom = "0";
                    arrDown.style.display = "block";
                } else if (numInputValue === numInputMin) {
                    num.style.paddingBottom = "0.8em";
                    num.style.height = "5em";
                    arrDown.style.display = "none";
                    num.style.paddingTop = "0";
                    arrUp.style.display = "block";
                } else {
                    num.style.padding = "0";
                    num.style.height = "7em";
                    arrUp.style.display = "block";
                    arrDown.style.display = "block";
                }

                // change the font to red if negative, green if positive, black if zero
                if (numInputValue>0) {
                    numInput.style.color = "#21d99b";
                } else if (numInputValue<0) {
                    numInput.style.color = "#ff1717";
                } else {
                    numInput.style.color = "#000";
                }
            }
        });

        function roll1d6() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function roll_dice(n_dice=3,modifier=0,n_adv=0) {
            let rolls = [];
            for (let i=0; i<(n_dice+Math.abs(n_adv)); i++) {
                rolls.push(roll1d6());
            }
            rolls.sort();
            if (n_adv>0) {
                rolls.reverse();
            }
            let roll_total = modifier;
            for (let i=0; i<n_dice; i++) {
                roll_total += rolls[i];
            }
            return [roll_total, rolls];
        }

        const history = document.getElementById('history');
        const clearHistoryBtn = document.querySelector('.clear-history');
        const rollDiceBtn = document.querySelector('.roll-dice');

        const numDiceInput = document.getElementById('num-dice-input');
        const modifierInput = document.getElementById('modifier-input');
        const numAdvInput = document.getElementById('adv-input');

        const resultDisplay = document.querySelector('.disp-result');
        

        rollDiceBtn.addEventListener('click', () => {
            const numDice = parseInt( numDiceInput.value );
            const modifier = parseInt( modifierInput.value );
            const numAdv = parseInt( numAdvInput.value );
            let dice_roll = roll_dice(numDice,modifier,numAdv);
            let dice_disp = dice_roll;//[1].slice(0,3);
            let rollStr = dice_roll[0] + ' = ' + dice_roll[1] + ' + ' + modifier + ', with ' + numAdv + ' adv' + '<br>';
            history.innerHTML = rollStr + history.innerHTML;
            history.scrollTop = 0;

            resultDisplay.innerHTML = dice_roll[0]
        });


        clearHistoryBtn.addEventListener('click', () => {
            history.innerHTML = '';
        });

    </script>
    </body>

</html>
